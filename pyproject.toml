[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gharownda-agent-kit"
version = "0.1.0"
description = "Bounded coding-agent contracts and local validation CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Gharownda contributors" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License"
]

[project.urls]
Repository = "https://github.com/Gharownda/gharownda-agent-kit"

[project.scripts]
gak = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent", "agent.*"]
