name: Private target coordinator

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-target-agent.yml"
      - "agent/private_target/**"
      - "agent/runtime/**"

permissions:
  contents: read
  actions: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate private target token permissions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GHAROWNDA_APP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::GHAROWNDA_APP_TOKEN is not configured"; exit 1; }
          gh api repos/Gharownda/gharownda-app >/dev/null || { echo "::error::Private repository access is unavailable"; exit 1; }
          gh api "repos/Gharownda/gharownda-app/git/matching-refs/heads/agent-lease/" >/dev/null || { echo "::error::Target token needs Contents: read/write"; exit 1; }
          gh api "repos/Gharownda/gharownda-app/pulls?state=open&per_page=1" >/dev/null || { echo "::error::Target token needs Pull requests: read/write"; exit 1; }
          gh api "repos/Gharownda/gharownda-app/actions/runs?per_page=1" >/dev/null || { echo "::error::Target token needs Actions: read"; exit 1; }

  worker:
    needs: preflight
    name: worker-slot-${{ matrix.slot }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        slot: [0, 1, 2, 3, 4]
    concurrency:
      group: private-target-slot-${{ matrix.slot }}
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TARGET_REPOSITORY: Gharownda/gharownda-app
      TRUSTED_REVIEWERS: faheemKamboh
      AGENT_TARGET_ROOT: ${{ github.workspace }}/target
      PYTHONPATH: ${{ github.workspace }}/agent-kit/agent/runtime
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gharownda_test
      PIP_NO_CACHE_DIR: "1"
      HF_HOME: /tmp/huggingface
      HF_XET_CHUNK_CACHE_SIZE_BYTES: "0"
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          path: agent-kit

      - name: Checkout private target without persisted credentials
        uses: actions/checkout@v7
        with:
          repository: Gharownda/gharownda-app
          token: ${{ secrets.GHAROWNDA_APP_TOKEN }}
          ref: main
          path: target
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Select and lease private work
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GHAROWNDA_APP_TOKEN }}
        run: |
          set -euo pipefail
          python agent-kit/agent/private_target/select_work.py --output /tmp/work.json
          kind="$(python -c 'import json; print(json.load(open("/tmp/work.json"))["kind"])')"
          if [ "$kind" = "none" ]; then
            echo "has_work=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Prepare existing private proposal for repair
        if: steps.select.outputs.kind == 'repair'
        shell: bash
        env:
          TARGET_TOKEN: ${{ secrets.GHAROWNDA_APP_TOKEN }}
        run: |
          set -euo pipefail
          head_ref="$(python -c 'import json; print(json.load(open("/tmp/work.json"))["head_ref"])')"
          auth="$(printf 'x-access-token:%s' "$TARGET_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git -C target fetch --depth=1 origin "$head_ref" >/dev/null 2>&1
          git -C target checkout -B "$head_ref" FETCH_HEAD >/dev/null 2>&1

      - name: Collect trusted repair feedback
        if: steps.select.outputs.kind == 'repair'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GHAROWNDA_APP_TOKEN }}
        run: |
          set -euo pipefail
          pr_number="$(python -c 'import json; print(json.load(open("/tmp/work.json"))["pr_number"])')"
          python agent-kit/agent/private_target/collect_feedback.py --pr-number "$pr_number" --output /tmp/feedback.json

      - uses: ruby/setup-ruby@v1
        if: steps.select.outputs.has_work == 'true'
        with:
          ruby-version: "3.4"
          bundler-cache: false

      - uses: actions/setup-node@v6
        if: steps.select.outputs.has_work == 'true'
        with:
          node-version: "24"

      - name: Install private target dependencies
        if: steps.select.outputs.has_work == 'true'
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          bundle install --jobs 4 --retry 3 >/dev/null
          npm ci >/dev/null

      - name: Prepare private test database
        if: steps.select.outputs.has_work == 'true'
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          bin/rails db:prepare >/dev/null

      - name: Install local inference runtime
        if: steps.select.outputs.has_work == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          python -m pip install 'huggingface_hub>=0.34' >/dev/null
          python -m pip install 'llama-cpp-python>=0.3.16' --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu >/dev/null

      - name: Produce bounded candidate
        if: steps.select.outputs.has_work == 'true'
        shell: bash
        run: |
          set -euo pipefail
          task="$(python -c 'import json; print(json.load(open("/tmp/work.json"))["task_file"])')"
          if [ "${{ steps.select.outputs.kind }}" = "repair" ]; then
            python agent-kit/agent/private_target/repair.py --task "$task" --feedback /tmp/feedback.json --model-key qwen3-14b-q4 --output /tmp/worker.json
          else
            python agent-kit/agent/runtime/worker.py --task "$task" --model-key qwen3-14b-q4 --output /tmp/worker.json
          fi

      - name: Deterministically verify candidate
        id: verify_initial
        continue-on-error: true
        if: steps.select.outputs.has_work == 'true'
        shell: bash
        run: |
          set -euo pipefail
          task="$(python -c 'import json; print(json.load(open("/tmp/work.json"))["task_file"])')"
          python agent-kit/agent/runtime/verify.py --task "$task" --worker-record /tmp/worker.json --report /tmp/verification.json --patch /tmp/candidate.patch

      - name: Repair candidate after first verification failure
        if: steps.select.outputs.has_work == 'true' && steps.verify_initial.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          task="$(python -c 'import json; print(json.load(open("/tmp/work.json"))["task_file"])')"
          python agent-kit/agent/runtime/repair_candidate.py --task "$task" --worker-record /tmp/worker.json --verification /tmp/verification.json --model-key qwen3-14b-q4 --output /tmp/worker-repair-1.json

      - name: Reverify first repaired candidate
        id: verify_repair_1
        continue-on-error: true
        if: steps.select.outputs.has_work == 'true' && steps.verify_initial.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          task="$(python -c 'import json; print(json.load(open("/tmp/work.json"))["task_file"])')"
          python agent-kit/agent/runtime/verify.py --task "$task" --worker-record /tmp/worker-repair-1.json --report /tmp/verification.json --patch /tmp/candidate.patch

      - name: Repair candidate after second verification failure
        if: steps.select.outputs.has_work == 'true' && steps.verify_initial.outcome == 'failure' && steps.verify_repair_1.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          task="$(python -c 'import json; print(json.load(open("/tmp/work.json"))["task_file"])')"
          python agent-kit/agent/runtime/repair_candidate.py --task "$task" --worker-record /tmp/worker-repair-1.json --verification /tmp/verification.json --model-key qwen3-14b-q4 --output /tmp/worker-repair-2.json

      - name: Reverify second repaired candidate
        id: verify_repair_2
        if: steps.select.outputs.has_work == 'true' && steps.verify_initial.outcome == 'failure' && steps.verify_repair_1.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          task="$(python -c 'import json; print(json.load(open("/tmp/work.json"))["task_file"])')"
          python agent-kit/agent/runtime/verify.py --task "$task" --worker-record /tmp/worker-repair-2.json --report /tmp/verification.json --patch /tmp/candidate.patch

      - name: Independently review candidate
        id: reviewer_initial
        continue-on-error: true
        if: steps.select.outputs.has_work == 'true' && (steps.verify_initial.outcome == 'success' || steps.verify_repair_1.outcome == 'success' || steps.verify_repair_2.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          task="$(python -c 'import json; print(json.load(open("/tmp/work.json"))["task_file"])')"
          python agent-kit/agent/runtime/reviewer.py --task "$task" --patch /tmp/candidate.patch --verification /tmp/verification.json --model-key qwen3-14b-q4 --output /tmp/review.json

      - name: Repair candidate after reviewer changes request
        if: steps.select.outputs.has_work == 'true' && steps.reviewer_initial.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          task="$(python -c 'import json; print(json.load(open("/tmp/work.json"))["task_file"])')"
          worker=/tmp/worker.json
          if [ "${{ steps.verify_initial.outcome }}" = "failure" ]; then worker=/tmp/worker-repair-1.json; fi
          if [ "${{ steps.verify_initial.outcome }}" = "failure" ] && [ "${{ steps.verify_repair_1.outcome }}" = "failure" ]; then worker=/tmp/worker-repair-2.json; fi
          python agent-kit/agent/runtime/repair_candidate.py --task "$task" --worker-record "$worker" --review /tmp/review.json --model-key qwen3-14b-q4 --output /tmp/worker-review-repair.json

      - name: Verify reviewer-repaired candidate
        if: steps.select.outputs.has_work == 'true' && steps.reviewer_initial.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          task="$(python -c 'import json; print(json.load(open("/tmp/work.json"))["task_file"])')"
          python agent-kit/agent/runtime/verify.py --task "$task" --worker-record /tmp/worker-review-repair.json --report /tmp/verification.json --patch /tmp/candidate.patch

      - name: Review repaired candidate
        if: steps.select.outputs.has_work == 'true' && steps.reviewer_initial.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          task="$(python -c 'import json; print(json.load(open("/tmp/work.json"))["task_file"])')"
          python agent-kit/agent/runtime/reviewer.py --task "$task" --patch /tmp/candidate.patch --verification /tmp/verification.json --model-key qwen3-14b-q4 --output /tmp/review.json

      - name: Publish exact reviewed candidate to private repository
        if: steps.select.outputs.has_work == 'true' && success()
        shell: bash
        env:
          TARGET_TOKEN: ${{ secrets.GHAROWNDA_APP_TOKEN }}
        run: |
          set -euo pipefail
          task="$(python -c 'import json; print(json.load(open("/tmp/work.json"))["task_file"])')"
          auth="$(printf 'x-access-token:%s' "$TARGET_TOKEN" | base64 -w0)"
          export GH_TOKEN="$TARGET_TOKEN"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          if [ "${{ steps.select.outputs.kind }}" = "repair" ]; then
            branch="$(python -c 'import json; print(json.load(open("/tmp/work.json"))["head_ref"])')"
            pr_number="$(python -c 'import json; print(json.load(open("/tmp/work.json"))["pr_number"])')"
            python agent-kit/agent/runtime/publish.py --task "$task" --verification /tmp/verification.json --review /tmp/review.json --existing-branch "$branch" --pr-number "$pr_number" --result /tmp/publish.json
          else
            python agent-kit/agent/runtime/publish.py --task "$task" --verification /tmp/verification.json --review /tmp/review.json --result /tmp/publish.json
          fi

      - name: Release private work lease
        if: always() && steps.select.outputs.has_work == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GHAROWNDA_APP_TOKEN }}
        run: |
          set -euo pipefail
          python agent-kit/agent/private_target/release_work.py --work /tmp/work.json

      - name: Refill available public worker slots
        if: success() && steps.select.outputs.has_work == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run private-target-agent.yml --repo Gharownda/gharownda-agent-kit >/dev/null
