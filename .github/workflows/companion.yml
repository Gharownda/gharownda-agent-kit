name: Development companion

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run deterministic repository checks
        run: python -m unittest discover -s tests -v
      - name: Install public CLI package
        run: python -m pip install .
      - name: Smoke test CLI entry point
        run: gak --help
