name: Bounded agent task
run-name: agent-task ${{ inputs.task_file }}

on:
  workflow_dispatch:
    inputs:
      task_file:
        description: Checked-in task manifest
        required: true
        default: agent/tasks/document-task-contract.json
      model_key:
        description: Local model key
        required: true
        default: qwen3-14b-q4
  workflow_call:
    inputs:
      task_file:
        description: Checked-in task manifest
        required: true
        type: string
      model_key:
        description: Local model key
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-task-${{ inputs.task_file }}
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PIP_NO_CACHE_DIR: '1'
      HF_HOME: /tmp/huggingface
      HF_XET_CHUNK_CACHE_SIZE_BYTES: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install inference runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'huggingface_hub>=0.34'
          python -m pip install 'llama-cpp-python>=0.3.16' --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Generate proposal
        run: |
          mkdir -p /tmp/agent-worker
          python agent/runtime/worker.py --task "${{ inputs.task_file }}" --model-key "${{ inputs.model_key }}" --output /tmp/agent-worker/worker.json
      - uses: actions/upload-artifact@v7
        with:
          name: agent-worker
          path: /tmp/agent-worker/worker.json
          retention-days: 7

  verify:
    needs: worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: agent-worker
          path: /tmp/agent-worker
      - name: Verify proposal
        run: |
          mkdir -p /tmp/agent-verification
          python agent/runtime/verify.py --task "${{ inputs.task_file }}" --worker-record /tmp/agent-worker/worker.json --report /tmp/agent-verification/verification.json --patch /tmp/agent-verification/candidate.patch
      - uses: actions/upload-artifact@v7
        with:
          name: agent-verification
          path: /tmp/agent-verification
          retention-days: 7

  reviewer:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PIP_NO_CACHE_DIR: '1'
      HF_HOME: /tmp/huggingface
      HF_XET_CHUNK_CACHE_SIZE_BYTES: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: agent-verification
          path: /tmp/agent-verification
      - name: Install inference runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'huggingface_hub>=0.34'
          python -m pip install 'llama-cpp-python>=0.3.16' --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Review candidate
        run: |
          mkdir -p /tmp/agent-review
          python agent/runtime/reviewer.py --task "${{ inputs.task_file }}" --patch /tmp/agent-verification/candidate.patch --verification /tmp/agent-verification/verification.json --model-key "${{ inputs.model_key }}" --output /tmp/agent-review/review.json
      - uses: actions/upload-artifact@v7
        with:
          name: agent-review
          path: /tmp/agent-review/review.json
          retention-days: 7

  publish:
    needs: [worker, verify, reviewer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: agent-worker
          path: /tmp/agent-worker
      - uses: actions/download-artifact@v8
        with:
          name: agent-verification
          path: /tmp/reviewed-verification
      - uses: actions/download-artifact@v8
        with:
          name: agent-review
          path: /tmp/agent-review
      - name: Re-verify exact candidate
        run: |
          python agent/runtime/verify.py --task "${{ inputs.task_file }}" --worker-record /tmp/agent-worker/worker.json --report /tmp/publish-verification.json --patch /tmp/publish-candidate.patch
          cmp /tmp/publish-candidate.patch /tmp/reviewed-verification/candidate.patch
      - name: Publish reviewed branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python agent/runtime/publish.py --task "${{ inputs.task_file }}" --verification /tmp/publish-verification.json --review /tmp/agent-review/review.json --base main
